{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'style/index.css' %}">
</head>


<body>

  <div class="cursor"></div>
  <div class="cursor-dot"></div>


  <div class="hero">
    <div class="hero-bg"></div>
    <!-- particulas -->
    <canvas id="goldParticles"></canvas>
    <div class="liquid-shape liquid-1"></div>
    <div class="liquid-shape liquid-2"></div>
    <div class="liquid-shape liquid-3"></div>
    <div class="particles-3d" id="particles3d"></div>

    <!-- Login -->
    <div class="login-box">
      <h2>Iniciar sesión</h2>
      <img src="{% static 'usuario.png' %}" alt="avatar">

      <form method="POST">
        {{error}}
        {% csrf_token %}
        <input type="email" name="gmail" placeholder="Ingrese su email" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <div class="options">
          <label><input type="checkbox" name="recordarme"> Recordarme</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="card-btn">Ingresar</button>
        <p>¿No tienes cuenta? <a class="enlace-invitado" href="{% url 'registro' %}">¡Crea una!</a></p>
      </form>

      <hr>
      <a class="enlace-invitado" href="{% url 'menu' %}">Continuar como invitado</a>
    </div>

  </div>

  <script src="{% static 'java/particles_gold.js' %}"></script>
  <script src="{% static 'java/cursor-custom.js' %}"></script>
</body>

</html>
