{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Registro - Abarrotes El Cecy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'style/registro.css' %}">
</head>

<body>

  <div class="cursor"></div>
  <div class="cursor-dot"></div>

  <div class="hero">

    <div class="hero-bg"></div>
    <canvas id="goldParticles"></canvas>
    <div class="liquid-shape liquid-1"></div>
    <div class="liquid-shape liquid-2"></div>
    <div class="liquid-shape liquid-3"></div>
    <div class="particles-3d" id="particles3d"></div>

    <div class="register-box">
      <h2>Registrarse</h2>
      <img src="{% static 'usuario.png' %}" alt="avatar">

      {% if error %}
        <p style="color: #FFD700; font-size: 13px; margin: 5px 0; text-align: center; font-weight: bold;">
          {{ error }}
        </p>
      {% endif %}

      <form method="POST" action="{% url 'registro' %}">
        {% csrf_token %}
        
        <input type="text" name="username" placeholder="Ingrese su nombre de usuario" required>
        <input type="email" name="gmail" placeholder="Ingrese su email" required> 
        <input type="password" name="password1" placeholder="Contraseña" required>
        <input type="password" name="password2" placeholder="Confirmar Contraseña" required>
        
        <div class="options">
          <p>¿Ya tienes cuenta? <a href="{% url 'index' %}">¡Inicia Sesión!</a></p>
        </div>
        
        <button type="submit" class="register-btn">Ingresar</button>
      </form>

      <hr>
      <a class="enlace-invitado" href="{% url 'menu' %}">Continuar como invitado</a>
    </div>
  </div>
  
  <script src="{% static 'java/particles_gold.js' %}"></script>
  <script src="{% static 'java/cursor-custom.js' %}"></script>

  <script>
    const formulario = document.querySelector('form');
    
    const mensajeDinamico = document.createElement('p');
    mensajeDinamico.style.color = '#FFD700';
    mensajeDinamico.style.fontSize = '14px';
    mensajeDinamico.style.textAlign = 'center';
    mensajeDinamico.style.marginTop = '10px';
    mensajeDinamico.style.fontWeight = 'bold';
    
    const boton = document.querySelector('.register-btn');
    formulario.insertBefore(mensajeDinamico, boton);

    formulario.addEventListener('submit', function(e) {
        const pass1 = document.querySelector('[name="password1"]').value;
        const pass2 = document.querySelector('[name="password2"]').value;

        mensajeDinamico.innerText = "";

        if (pass1 !== pass2) {
            e.preventDefault();
            mensajeDinamico.innerText = "Error: Las contraseñas no coinciden.";
            return;
        }

        if (pass1.length < 8) {
            e.preventDefault();
            mensajeDinamico.innerText = "Error: La contraseña debe tener al menos 8 caracteres.";
            return;
        }
    });
  </script>
</body>

</html>
